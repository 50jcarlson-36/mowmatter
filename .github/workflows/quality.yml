name: MowMatter quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm run check
        working-directory: api
      - run: npm ci && npm test && npm run build
        working-directory: office
      - run: npm ci && npm test && npm run build
        working-directory: crew
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-lock crew/supabase/functions/mowmatter-crew/index.ts crew/supabase/functions/mowmatter-business/index.ts supabase/functions/mowmatter-capture/index.ts supabase/functions/mowmatter-growth/index.ts
      - run: node api/scripts/security-headers.mjs --check
      - run: git diff --check
